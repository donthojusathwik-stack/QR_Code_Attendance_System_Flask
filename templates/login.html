{% extends "base.html" %}
{% block title %}Admin Login · QR Attendance{% endblock %}
{% block content %}
<section class="login-card">
  <div class="icon-large">▦</div>
  <h1>Admin login</h1>
  <p class="muted">Sign in to manage students and attendance.</p>
  <form method="post" class="stack">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">Demo login: <strong>admin</strong> / <strong>admin123</strong></p>
  <p class="hint">Change the demo password before using this outside your own computer.</p>
</section>
{% endblock %}
